name: VAELITH CI/CD Release & QA Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_rollback_dryrun:
        description: 'Validar capacidad de rollback atomico en modo DryRun tras despliegue'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: vaelith-qa
  cancel-in-progress: false

jobs:
  release:
    name: Liberacion Continua y Despliegue QA (Windows x64)
    runs-on: [self-hosted, Windows, X64, unity-6000.6]
    timeout-minutes: 60
    environment: qa
    defaults:
      run:
        shell: powershell
    env:
      UNITY_EDITOR: ${{ vars.UNITY_EDITOR }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout del repositorio con Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Aprovisionar y auditar entorno de liberacion
        run: ./ci/setup_release_env.ps1

      - name: Preparar manifiesto y espacio limpio de artefactos
        run: ./ci/prepare.ps1

      - name: Ejecutar pruebas automatizadas EditMode y PlayMode
        run: ./ci/test.ps1

      - name: Compilar cliente StandaloneWindows64 (Direct3D11)
        run: ./ci/build.ps1

      - name: Ejecutar prueba de humo y telemetria SLA en tiempo real
        run: ./ci/smoke.ps1

      - name: Desplegar paquete verificado SHA-256 a entorno QA
        run: ./ci/deploy.ps1

      - name: Verificar disponibilidad de reversion atomica (DryRun)
        if: ${{ github.event.inputs.verify_rollback_dryrun != 'false' }}
        run: ./ci/rollback.ps1 -DryRun

      - name: Publicar artefactos de auditoria, logs y telemetria
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ env.BUILD_ID }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
